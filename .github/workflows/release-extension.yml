# Template GitHub Actions workflow for each custom DuckDB v2.0.0 extension repository
# (duckdb-postgres, duckdb-mysql, oracle_scanner, sqlserver_scanner, odbc_catalog_scanner)
# on branch `2.0.0`.
#
# Copy into `<extension-repo>/.github/workflows/release-extension.yml`, commit to `2.0.0`,
# and push a tag `v2.0.0-<rev>` (or run manually via `workflow_dispatch`).
name: Release DuckDB v2.0.0 Extension
on:
  push:
    tags:
      - 'v2.0.0-*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag name (e.g. v2.0.0-abc1234567); defaults to v2.0.0-<short_sha>
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-ext-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    name: Build Linux amd64 v2.0.0 Extension
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GEN: ninja
      STATIC_LIBCPP: '1'
      OVERRIDE_GIT_DESCRIBE: v2.0.0
      DUCKDB_PLATFORM: linux_amd64
      EXTENSION_STATIC_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false

      - name: Resolve extension metadata and build flags from Makefile
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re

          PROFILES = {
              'postgres_scanner': {
                  'use_vcpkg': 'true',
                  'vcpkg_commit': 'a42af01b72c28a8e1d7b48107b33e4f286a55ef6',
                  'vcpkg_triplet': 'x64-linux',
                  'extra_cmake_flags': '-DBUILD_SHELL=0 -DBUILD_UNITTESTS=0 -DPOSTGRES_GUARDED_CRUD=ON',
                  'required_symbol': 'RegisterPostgresGuardedCRUD',
                  'require_libodbc': 'false',
              },
              'mysql_scanner': {
                  'use_vcpkg': 'true',
                  'vcpkg_commit': '84bab45d415d22042bd0b9081aea57f362da3f35',
                  'vcpkg_triplet': 'x64-linux-release',
                  'extra_cmake_flags': '-DBUILD_SHELL=0 -DBUILD_UNITTESTS=0 -DMYSQL_GUARDED_CRUD=ON',
                  'required_symbol': 'RegisterMySQLGuardedCRUD',
                  'require_libodbc': 'false',
              },
              'oracle_scanner': {
                  'use_vcpkg': 'false',
                  'vcpkg_commit': '',
                  'vcpkg_triplet': '',
                  'extra_cmake_flags': '-DBUILD_SHELL=0 -DBUILD_UNITTESTS=0 -DORACLE_GUARDED_CRUD=ON',
                  'required_symbol': 'RegisterOracleGuardedCRUD',
                  'require_libodbc': 'true',
              },
              'sqlserver_scanner': {
                  'use_vcpkg': 'false',
                  'vcpkg_commit': '',
                  'vcpkg_triplet': '',
                  'extra_cmake_flags': '-DBUILD_SHELL=0 -DBUILD_UNITTESTS=0 -DSQLSERVER_GUARDED_CRUD=ON',
                  'required_symbol': 'RegisterSQLServerGuardedCRUD',
                  'require_libodbc': 'true',
              },
              'odbc_catalog_scanner': {
                  'use_vcpkg': 'false',
                  'vcpkg_commit': '',
                  'vcpkg_triplet': '',
                  'extra_cmake_flags': '-DBUILD_SHELL=0 -DBUILD_UNITTESTS=0',
                  'required_symbol': 'RegisterDb2GuardedCRUD',
                  'require_libodbc': 'true',
              },
          }

          makefile = pathlib.Path('Makefile').read_text(encoding='utf-8')
          match = re.search(r'^EXT_NAME\s*:?=\s*([A-Za-z0-9_]+)\s*$', makefile, re.MULTILINE)
          assert match, 'Unable to find EXT_NAME in Makefile'
          ext_name = match.group(1)
          assert ext_name in PROFILES, f'Unsupported EXT_NAME {ext_name!r}'
          profile = PROFILES[ext_name]

          if os.environ['EVENT_NAME'] == 'push':
              release_tag = os.environ['REF_NAME']
          else:
              release_tag = os.environ.get('INPUT_TAG', '').strip() or f"v2.0.0-{os.environ['COMMIT_SHA'][:10]}"
          assert re.fullmatch(r'v2\.0\.0-[A-Za-z0-9._-]+', release_tag), f'invalid release tag: {release_tag}'

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'ext_name={ext_name}\n')
              fh.write(f'release_tag={release_tag}\n')
              for key, value in profile.items():
                  fh.write(f'{key}={value}\n')
          PY

      - name: Install build and ODBC development dependencies
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq \
            build-essential cmake ninja-build ccache python3 \
            unixodbc-dev pkg-config libssl-dev zip unzip curl

      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ext-${{ steps.meta.outputs.ext_name }}-v2.0.0-linux_amd64

      - name: Setup vcpkg (postgres/mysql)
        if: steps.meta.outputs.use_vcpkg == 'true'
        uses: lukka/run-vcpkg@v11.1
        with:
          vcpkgGitCommitId: ${{ steps.meta.outputs.vcpkg_commit }}

      - name: Build release DuckDB v2.0.0 extension
        env:
          USE_VCPKG: ${{ steps.meta.outputs.use_vcpkg }}
          VCPKG_TRIPLET: ${{ steps.meta.outputs.vcpkg_triplet }}
          EXTRA_CMAKE_FLAGS: ${{ steps.meta.outputs.extra_cmake_flags }}
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          export EXT_RELEASE_FLAGS="$EXTRA_CMAKE_FLAGS"
          if [ "$USE_VCPKG" = "true" ]; then
            export VCPKG_TOOLCHAIN_PATH="${GITHUB_WORKSPACE}/vcpkg/scripts/buildsystems/vcpkg.cmake"
            export VCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"
            export VCPKG_HOST_TRIPLET="$VCPKG_TRIPLET"
          else
            unset VCPKG_ROOT VCPKG_TOOLCHAIN_PATH VCPKG_INSTALLATION_ROOT
          fi
          make release

      - name: Verify ABI, guarded CRUD symbols, dynamic deps, and package release asset
        id: pkg
        env:
          EXT_NAME: ${{ steps.meta.outputs.ext_name }}
          REL_TAG: ${{ steps.meta.outputs.release_tag }}
          REQUIRED_SYMBOL: ${{ steps.meta.outputs.required_symbol }}
          REQUIRE_LIBODBC: ${{ steps.meta.outputs.require_libodbc }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_NAME: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import json
          import os
          import pathlib
          import shutil
          import subprocess

          ext_name = os.environ['EXT_NAME']
          rel_tag = os.environ['REL_TAG']
          required_symbol = os.environ['REQUIRED_SYMBOL']
          require_libodbc = os.environ['REQUIRE_LIBODBC'] == 'true'

          try:
              ext_bin = pathlib.Path(f'build/release/extension/{ext_name}/{ext_name}.duckdb_extension')
              if not ext_bin.is_file():
                  ext_bin = next(pathlib.Path('build/release').rglob(f'{ext_name}.duckdb_extension'), None)
              assert ext_bin is not None and ext_bin.is_file() and ext_bin.stat().st_size > 0, (
                  f'Missing extension binary for {ext_name} under build/release'
              )
              print(f'Extension binary: {ext_bin} ({ext_bin.stat().st_size} bytes)')

              ldd_out = subprocess.check_output(['ldd', str(ext_bin)], text=True)
              print(ldd_out)
              assert 'not found' not in ldd_out, f'Missing shared libraries in {ext_bin}'
              if require_libodbc:
                  assert 'libodbc.so.2' in ldd_out, f'Expected libodbc.so.2 linkage in {ext_bin}'

              raw = ext_bin.read_bytes()
              nm_dyn = subprocess.run(['nm', '-D', '--defined-only', str(ext_bin)], capture_output=True, text=True, check=False).stdout
              nm_all = subprocess.run(['nm', '--defined-only', str(ext_bin)], capture_output=True, text=True, check=False).stdout
              symbols_text = nm_dyn + '\n' + nm_all
              guarded_lines = [line.strip() for line in nm_dyn.splitlines() if 'Guarded' in line or 'duckdb_cpp_init' in line]
              print('Guarded/entry symbols:', guarded_lines[:20])
              assert required_symbol in symbols_text or required_symbol.encode('utf-8') in raw, (
                  f'Missing guarded CRUD symbol {required_symbol!r} in {ext_bin}'
              )

              footer_tokens = [tok.decode('utf-8', errors='replace') for tok in raw[-512:].split(b'\x00') if tok]
              print('Footer tokens:', footer_tokens)
              assert 'v2.0.0' in footer_tokens or b'v2.0.0' in raw[-512:], f'Missing v2.0.0 footer in {ext_bin}'
              assert 'linux_amd64' in footer_tokens or b'linux_amd64' in raw[-512:], f'Missing linux_amd64 footer in {ext_bin}'
          except AssertionError as exc:
              print(f'::error::{exc}')
              raise

          dist_dir = pathlib.Path('dist')
          dist_dir.mkdir(parents=True, exist_ok=True)
          raw_asset = dist_dir / f'{ext_name}-v2.0.0-linux_amd64.duckdb_extension'
          gz_asset = dist_dir / f'{ext_name}-v2.0.0-linux_amd64.duckdb_extension.gz'
          shutil.copy2(ext_bin, raw_asset)
          with gz_asset.open('wb') as raw_out:
              with gzip.GzipFile(filename=raw_asset.name, mode='wb', fileobj=raw_out, compresslevel=9, mtime=0) as gz:
                  gz.write(raw)

          raw_sha = hashlib.sha256(raw).hexdigest()
          gz_sha = hashlib.sha256(gz_asset.read_bytes()).hexdigest()
          (dist_dir / 'SHA256SUMS.txt').write_text(
              f'{raw_sha}  {raw_asset.name}\n{gz_sha}  {gz_asset.name}\n',
              encoding='utf-8',
          )
          meta = {
              'repository': os.environ['REPO_NAME'],
              'extension_name': ext_name,
              'release_tag': rel_tag,
              'commit_sha': os.environ['COMMIT_SHA'],
              'duckdb_version': 'v2.0.0',
              'platform': 'linux_amd64',
              'asset': gz_asset.name,
              'uncompressed_sha256': raw_sha,
              'compressed_sha256': gz_sha,
          }
          (dist_dir / 'release-metadata.json').write_text(json.dumps(meta, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'raw_sha={raw_sha}\n')
              fh.write(f'gz_asset={gz_asset.as_posix()}\n')
          PY

      - name: Publish immutable GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
          REF_TYPE: ${{ github.ref_type }}
          COMMIT_SHA: ${{ github.sha }}
          REL_TAG: ${{ steps.meta.outputs.release_tag }}
          EXT_NAME: ${{ steps.meta.outputs.ext_name }}
          GZ_ASSET: ${{ steps.pkg.outputs.gz_asset }}
        run: |
          extra=()
          if [ "$REF_TYPE" != "tag" ]; then
            extra+=(--target "$COMMIT_SHA")
          fi
          gh release delete "$REL_TAG" --yes >/dev/null 2>&1 || true
          gh release create "$REL_TAG" \
            "$GZ_ASSET" \
            dist/SHA256SUMS.txt \
            dist/release-metadata.json \
            "${extra[@]}" \
            --title "${EXT_NAME} ${REL_TAG}" \
            --notes "Custom DuckDB v2.0.0 extension build for linux_amd64 (${EXT_NAME})."
